
name: CI DevOps Practica

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    

    steps:
    
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: dotnet test
    
